# Derived from gbplanner_ros (branch gbplanner2) gbplanner/config/smb/planner_control_interface_sim_config.yaml for ANYmal D in the isaac_explore cave.
run_mode: kSim
trigger_mode: kManual
robot_type: kGround
output_type: kAction
init_motion_enable: false
planner_trigger_lead_time: 0.0
smooth_heading_enable: true
world_frame_id: odom   # the frame of /bievr_lio/odom; also the frame GBPlanner plans and visualizes in
init_motion:
  z_takeoff: 2.5
  z_drop: 1.7
  x_forward: 4.0   # ground robots: the init motion (isaac_adapter.py) walks this far along +x first, see there

# Group related parameters to be shared between nodes.
RobotDynamics:
  v_max: 1.0
  v_init_max: 1.0
  v_homing_max: 1.0  # explore.sh speed:= default
  yaw_rate_max: 0.5
  dt: 0.05
